  <div class="brand">
    <div class="btitle">
      <h1>SORTIE</h1>

      <div class="legend">
        <span><i style="background:var(--r-dd)"></i>DD</span>
        <span><i style="background:var(--r-tank)"></i>Tank</span>
        <span><i style="background:var(--r-buff)"></i>Buff</span>
        <span><i style="background:var(--r-heal)"></i>Heal</span>
      </div>
    </div>
  </div>
  <div class="topctl" id="topctl"></div>
</header>

<div class="bars">
  <div class="jobrow floorrow" id="floor"><span class="rlabel">Étage</span></div>

  <div class="jobrow" id="comp"><span class="rlabel">Comp · flex</span>

    <button class="chip compchip" data-c="DNC" style="--jc:var(--r-dd)">DNC</button>
  </div>
  <div class="jobrow" id="jobs"><span class="rlabel">Mon rôle</span></div>
</div>
</div>

<div class="wrap" id="app"></div>
