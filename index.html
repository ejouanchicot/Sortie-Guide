<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Ce que voit quelqu'un qui n'a PAS encore ouvert la page : l'onglet du
     navigateur, et surtout l'aperçu quand on colle le lien sur Discord.
     Discord ne lit que le HTML, jamais le JavaScript — ces lignes ne peuvent
     donc pas se déduire de data.js. Si tu publies une autre strat que Sortie,
     c'est ici que son nom se change, et nulle part ailleurs.
     `og:site_name` porte l'outil, `og:title` le contenu : Discord affiche le
     premier en petit au-dessus du second. -->
<title>Sortie · Guide de run — XI STUDIO</title>
<meta name="description" content="Guide de run Sortie (FINAL FANTASY XI) — 4 phases, stratégie par rôle. Linkshell Nightfallens. Écrit avec XI STUDIO.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="XI STUDIO">
<meta property="og:title" content="Sortie · Guide de run">
<meta property="og:description" content="Stratégie complète · 4 phases · Degei → Skomora → Leshonn → Ghatjot · filtre par rôle et mode Solo.">
<meta property="og:image" content="https://ejouanchicot.github.io/Sortie-Guide/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="XI STUDIO — FFXI Strategy Editor">
<meta property="og:url" content="https://ejouanchicot.github.io/Sortie-Guide/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ejouanchicot.github.io/Sortie-Guide/og.jpg">
<!-- la couleur dont le navigateur teinte sa barre autour de la page : c'est
     le --bg réel du thème sombre, sinon la jointure se voit -->
<meta name="theme-color" content="#07090d">
<script>try{var t=localStorage.getItem('sortie_theme');document.documentElement.setAttribute('data-theme',(t==='light')?'light':'dark');}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/icon-180.webp">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<!-- space-grotesk porte le titre, les libellés et les noms de carte : elle est
     la plus visible au-dessus de la ligne de flottaison, et elle arrivait APRÈS
     le premier pixel. Le titre s'affichait en Inter puis se réécrivait. -->
<link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<!-- La carte du run, en dur — comme og:image juste au-dessus, et pour la même
     raison : le navigateur ne peut pas la deviner. Son adresse vit dans
     data.js, elle n'entrait donc dans la page qu'une fois les cinq scripts
     exécutés, et s'affichait à 4,3 s sur un téléphone en 4G. Avec ce préchargement,
     2,6 s. C'est l'écran que le lead vient voir quand il ouvre le lien entre
     deux packs.
     Si la carte d'ouverture change de nom, cette ligne suit — sinon elle ne
     coûte qu'un 404 silencieux, jamais un affichage de travers. -->
<!-- « low » et pas « high » : la balise <img> de la carte n'existe qu'une fois
     app.js exécuté, donc la carte ne PEUT PAS être peinte plus tôt. La priorité
     haute ne faisait que voler la bande passante à app.js, qui lui est sur le
     chemin critique. Mesuré en 3G rapide, CPU ×4 : la strat lisible à 2 986 ms
     au lieu de 3 281, et la carte peinte à 3 027 au lieu de 3 315 — les deux y
     gagnent. Le préchargement, lui, reste : sans lui, 5 150 et 6 690 ms. -->
<link rel="preload" href="img/cartes/map.webp" as="image" fetchpriority="low">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="scrollbar"><i id="sbar"></i></div>
<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

<div class="topstick">
<header>
  <div class="brand">
    <!-- Le titre reste celui de la STRAT : c'est elle qu'on vient lire. L'outil
         se signe discrètement à côté, et sert de porte vers l'atelier pour qui
         mène le run. -->
    <a class="bmark" href="tools/studio.html" title="Ouvrir l'atelier — XI STUDIO"
       aria-label="Ouvrir l'atelier XI STUDIO"><img src="img/logo.webp" alt="" width="40" height="40"></a>
    <div class="btitle">
      <h1 id="gTitre">…</h1>
      <span class="bsub" id="gSous"></span>
      <div class="legend">
        <span><i style="background:var(--r-dd)"></i>DD</span>
        <span><i style="background:var(--r-tank)"></i>Tank</span>
        <span><i style="background:var(--r-buff)"></i>Buff</span>
        <span><i style="background:var(--r-heal)"></i>Heal</span>
      </div>
    </div>
  </div>
  <div class="topctl" id="topctl"></div>
</header>

<div class="bars">
  <div class="jobrow floorrow" id="floor"><span class="rlabel">Étage</span></div>
  <div class="jobrow zonerow" id="zone" style="display:none"><span class="rlabel">Zone</span></div>
  <div class="navrow nav" id="nav"><span class="rlabel">Phases</span></div>
  <!-- les variantes sont declarees dans data.js (COMPO.variantes) : app.js
       construit les boutons, la rangee disparait s'il n'y en a qu'une -->
  <div class="jobrow" id="comp"><span class="rlabel">Comp · flex</span></div>
  <div class="jobrow" id="jobs"><span class="rlabel">Mon rôle</span></div>
</div>
</div>

<div class="wrap" id="app"></div>

<p class="foot">Stratégie de run · mise en page interactive · clique ton job pour faire ressortir tes actions.</p>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sortie-map-core.js"></script>
<script src="js/strat-render.js"></script>
<script src="js/app.js"></script>
<!-- Le guide se met AUSSI hors ligne. Le service worker n'etait enregistre que
     depuis l'atelier : le linkshell, qui recoit un lien et ne fait que lire, ne
     l'installait donc jamais — reseau coupe, le guide n'affichait plus rien.
     C'est le public le plus nombreux, et c'etait le moins couvert.
     Le service worker ne fait que le hors-ligne, et il echoue en silence : un
     guide ouvert depuis un fichier (file://) ne peut pas en avoir, et n'en a
     pas besoin puisque tout est deja sur le disque. -->
<script id="sw-guide">if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});});}</script>
</body>
</html>
